<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stylish Closet — Premium Streetwear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --bg2:#0f0f0f;
    --card:#131313;
    --border:#2a2a2a;
    --fg:#f5f5f5;
    --muted:#9a9a9a;
    --accent:#f2704a;
    --white:#ffffff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--fg);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.heading{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-weight:600;
  }
  .kicker{
    font-family:'Inter', sans-serif;
    text-transform:uppercase;
    letter-spacing:3px;
    font-size:12px;
    color:var(--muted);
    font-weight:600;
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  .container{max-width:1100px; margin:0 auto; padding:0 24px;}
  .hidden{display:none !important;}

  /* NAV */
  .navbar{
    position:sticky; top:0; z-index:40;
    background:var(--bg); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 24px;
  }
  .brand{
    font-family:'Oswald', sans-serif; font-size:22px; font-weight:700;
    letter-spacing:2px; text-transform:uppercase; cursor:pointer;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:14px 22px; font-size:13px; font-weight:600;
    letter-spacing:2px; text-transform:uppercase;
    border-radius:2px; border:1px solid transparent;
    transition:opacity .15s ease;
  }
  .btn:hover{opacity:.85;}
  .btn-primary{background:var(--white); color:#0a0a0a;}
  .btn-outline{background:transparent; color:var(--fg); border:1px solid #444;}
  .btn-block{width:100%;}
  .btn-sm{padding:9px 14px; font-size:11px;}

  /* HERO */
  .hero{padding:70px 24px 50px;}
  .hero .kicker{margin-bottom:18px;}
  .hero h1{font-size:64px; line-height:0.95; margin-bottom:26px;}
  .hero p{color:#c9c9c9; font-size:19px; max-width:640px; line-height:1.5; margin-bottom:34px;}
  .hero .actions{display:flex; flex-wrap:wrap; gap:14px;}
  .banner-strip{
    background:var(--card); border-top:1px solid var(--border); border-bottom:1px solid var(--border);
    text-align:center; padding:14px; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#ddd;
  }
  .hero-photo{width:100%; display:block; aspect-ratio:4/5; object-fit:cover; background:#111;}

  /* SECTION HEAD */
  .section{padding:60px 24px;}
  .section-head{margin-bottom:30px;}
  .section-head .kicker{margin-bottom:10px;}
  .section-head h2{font-size:38px;}

  /* PRODUCT GRID */
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:26px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:4px; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .card-media{
    position:relative; aspect-ratio:4/5; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg,#222,#0a0a0a);
    cursor:pointer;
  }
  .photo-count{
    position:absolute; bottom:14px; right:14px; background:rgba(0,0,0,.65); color:#fff;
    font-size:11px; font-weight:700; letter-spacing:1px; padding:5px 10px; border-radius:2px;
  }

  /* LIGHTBOX */
  .lightbox-overlay{
    position:fixed; inset:0; background:#050505; z-index:200;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
  }
  .lightbox-close{
    position:absolute; top:22px; right:22px; font-size:30px; color:#fff; cursor:pointer;
    width:44px; height:44px; display:flex; align-items:center; justify-content:center;
    z-index:210; line-height:1;
  }
  .lightbox-close:hover{opacity:.7;}
  .lightbox-stage{
    position:relative; width:100%; max-width:640px; display:flex; align-items:center; justify-content:center;
    padding:0 60px;
  }
  .lightbox-img{max-width:100%; max-height:78vh; object-fit:contain;}
  .lightbox-arrow{
    position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2); color:#fff; width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:20px; user-select:none;
  }
  .lightbox-arrow:hover{background:rgba(255,255,255,.18);}
  .lightbox-arrow.prev{left:6px;}
  .lightbox-arrow.next{right:6px;}
  .lightbox-dots{display:flex; gap:8px; margin-top:20px;}
  .lightbox-dot{width:8px; height:8px; border-radius:50%; background:#444; cursor:pointer;}
  .lightbox-dot.active{background:#fff;}
  .lightbox-caption{color:#ccc; font-size:14px; margin-top:16px; letter-spacing:1px; text-transform:uppercase;}
  .card-media img{width:100%; height:100%; object-fit:cover;}
  .card-media .placeholder-mark{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:15px; letter-spacing:3px;
    color:#3a3a3a; text-transform:uppercase; text-align:center; padding:20px;
  }
  .badges{position:absolute; top:14px; left:14px; display:flex; flex-direction:column; gap:8px; align-items:flex-start;}
  .badge{
    font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
    padding:7px 14px;
  }
  .badge-new{background:var(--white); color:#0a0a0a;}
  .badge-special{background:var(--accent); color:#0a0a0a;}
  .card-body{padding:20px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .card-body .kicker{font-size:11px;}
  .card-body h3{font-size:22px;}
  .price-row{display:flex; align-items:center; gap:10px; margin:2px 0 4px;}
  .price-now{font-size:20px; font-weight:700; font-family:'Oswald',sans-serif;}
  .price-old{color:#777; text-decoration:line-through; font-size:15px;}
  .fire{font-size:14px;}
  .variants{color:var(--muted); font-size:13px; margin-bottom:12px;}
  .card-body select{
    background:#0a0a0a; border:1px solid var(--border); color:var(--fg); padding:8px 10px;
    font-size:13px; margin-bottom:8px; width:100%;
  }
  .order-btn{
    margin-top:auto; background:var(--white); color:#0a0a0a; text-align:center;
    padding:14px; font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
    border:none; width:100%;
  }
  .sold-out{opacity:.5;}
  .sold-out .order-btn{background:#333; color:#888; cursor:not-allowed;}

  /* HOW TO ORDER */
  .steps{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:18px;}

  /* SHOP BY CATEGORY */
  .cat-pills{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:34px;}
  .cat-pill{
    padding:16px 22px; border:1px solid #333; background:transparent; color:var(--fg);
    font-size:13px; font-weight:600; letter-spacing:2px; text-transform:uppercase;
  }
  .cat-pill.active{background:var(--white); color:#0a0a0a; border-color:var(--white);}
  .cat-empty{color:var(--muted); padding:30px 4px; font-size:15px;}
  .step{border:1px solid var(--border); padding:30px 26px;}
  .step .num{font-family:'Oswald',sans-serif; font-size:40px; color:#555; margin-bottom:14px;}
  .step h3{font-size:20px; margin-bottom:10px;}
  .step p{color:var(--muted); font-size:15px; line-height:1.5;}

  /* CTA */
  .cta-block{
    background:var(--bg2); border-top:1px solid var(--border); border-bottom:1px solid var(--border);
    text-align:center; padding:80px 24px;
  }
  .cta-block .icon{font-size:44px; margin-bottom:20px;}
  .cta-block h2{font-size:34px; margin-bottom:14px;}
  .cta-block p{color:var(--muted); max-width:480px; margin:0 auto 30px; line-height:1.5;}

  /* SOCIAL */
  .social-list{display:flex; flex-direction:column; gap:0; border-top:1px solid var(--border);}
  .social-row{
    display:flex; align-items:center; justify-content:space-between; padding:26px 4px;
    border-bottom:1px solid var(--border); font-size:22px; font-family:'Oswald',sans-serif;
  }
  .social-row span.handle{color:var(--muted); font-size:15px; font-family:'Inter',sans-serif; letter-spacing:1px;}

  /* FOOTER */
  footer{padding:50px 24px 30px; border-top:1px solid var(--border); margin-top:20px;}
  footer .brand{margin-bottom:8px;}
  footer p{color:var(--muted); font-size:14px; margin-bottom:16px;}
  footer .footer-row{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  .admin-dot{
    width:26px; height:26px; border-radius:50%; border:1px solid #333; color:#555;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
    opacity:0.4;
  }
  .admin-dot:hover{opacity:1; border-color:#777; color:#aaa;}
  .copyright{color:#555; font-size:12px; margin-top:20px;}

  /* AUTH PAGE */
  .auth-wrap{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px;
  }
  .auth-icon{
    width:64px; height:64px; background:var(--white); border-radius:14px;
    display:flex; align-items:center; justify-content:center; font-size:26px; color:#0a0a0a; margin-bottom:26px;
  }
  .auth-wrap h1{font-size:36px; margin-bottom:8px; text-align:center;}
  .auth-wrap .sub{color:var(--muted); margin-bottom:30px; text-align:center;}
  .auth-card{
    width:100%; max-width:420px; border:1px solid var(--border); padding:34px 28px; background:var(--card);
  }
  .g-btn{
    width:100%; padding:14px; border:1px solid #444; background:transparent; color:var(--fg);
    display:flex; align-items:center; justify-content:center; gap:10px; font-weight:600; font-size:15px;
    margin-bottom:22px;
  }
  .divider{display:flex; align-items:center; gap:14px; color:#666; font-size:12px; letter-spacing:2px; margin-bottom:22px;}
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--border);}
  .field label{display:block; font-size:14px; font-weight:600; margin-bottom:8px;}
  .field{margin-bottom:18px;}
  .field-row{display:flex; align-items:center; justify-content:space-between;}
  .field-row a{font-size:13px; color:#ccc;}
  .field input, .field textarea, .field select{
    width:100%; padding:13px 14px; background:#0a0a0a; border:1px solid var(--border); color:var(--fg);
    font-size:15px;
  }
  .auth-foot{margin-top:24px; text-align:center; color:var(--muted); font-size:14px;}
  .auth-foot b{color:var(--fg); cursor:pointer;}
  .auth-error{background:#2a1414; border:1px solid #7a2a2a; color:#ff9a9a; padding:12px 14px; font-size:13px; margin-bottom:18px;}

  /* GOOGLE PICKER MODAL */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .g-modal{background:#1c1c1c; border-radius:8px; width:100%; max-width:420px; padding:30px 24px; color:#eee;}
  .g-modal h2{font-family:'Inter',sans-serif; font-weight:500; font-size:24px; margin-bottom:6px;}
  .g-modal .sub{color:#aaa; font-size:14px; margin-bottom:20px;}
  .g-acct{
    display:flex; align-items:center; gap:14px; padding:12px 6px; border-bottom:1px solid #333; cursor:pointer;
  }
  .g-acct:hover{background:#262626;}
  .g-avatar{
    width:36px; height:36px; border-radius:50%; background:#555; color:#fff; display:flex; align-items:center;
    justify-content:center; font-weight:600; flex-shrink:0;
  }
  .g-acct-name{font-size:15px; font-weight:500;}
  .g-acct-email{font-size:13px; color:#999;}
  .g-modal .close-x{float:right; cursor:pointer; color:#999; font-size:20px;}

  /* ADMIN DASHBOARD */
  .admin-header{
    display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:16px;
    padding:36px 24px 26px; border-bottom:1px solid var(--border);
  }
  .admin-header h1{font-size:36px; margin:6px 0 8px;}
  .admin-header .sub{color:var(--muted); font-size:14px;}
  .admin-header .actions{display:flex; gap:12px;}
  .stat-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px;
    padding:26px 24px;
  }
  .stat-card{border:1px solid var(--border); padding:22px;}
  .stat-card .kicker{margin-bottom:14px;}
  .stat-card .num{font-family:'Oswald',sans-serif; font-size:42px;}
  .stat-card .note{color:var(--muted); font-size:12px; margin-top:6px;}

  .admin-section{padding:10px 24px 40px;}
  .admin-section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:12px;}
  .admin-section-head h2{font-size:28px;}

  table{width:100%; border-collapse:collapse; font-size:14px;}
  thead th{
    text-align:left; padding:14px 12px; color:var(--muted); font-size:11px; letter-spacing:2px;
    text-transform:uppercase; border-bottom:1px solid var(--border); white-space:nowrap;
  }
  tbody td{padding:16px 12px; border-bottom:1px solid var(--border); vertical-align:middle; white-space:nowrap;}
  .table-scroll{overflow-x:auto; border:1px solid var(--border);}
  .table-scroll table{border:none;}
  .strike{color:#666; text-decoration:line-through; margin-left:6px; font-size:13px;}
  .toggle-pill{
    border:1px solid #444; padding:6px 14px; font-size:12px; font-weight:700; letter-spacing:1px; background:transparent; color:var(--fg);
  }
  .toggle-pill.on{border-color:#4caf7d; color:#4caf7d;}
  .icon-btn{
    width:34px; height:34px; border:1px solid var(--border); background:transparent; color:var(--fg);
    display:inline-flex; align-items:center; justify-content:center; margin-right:6px; font-size:14px;
  }
  .icon-btn:hover{border-color:#777;}
  .low-note{color:#e08a4a;}

  .leads-list{border:1px solid var(--border);}
  .lead-row{
    display:flex; align-items:center; justify-content:space-between; padding:18px;
    border-bottom:1px solid var(--border); font-size:15px;
  }
  .lead-row:last-child{border-bottom:none;}
  .lead-row .date{color:var(--muted); font-size:13px;}
  .empty-note{color:var(--muted); padding:26px; text-align:center; border:1px dashed var(--border);}

  .settings-card{border:1px solid var(--border); padding:26px; max-width:560px;}

  /* PRODUCT MODAL */
  .pmodal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:100; overflow-y:auto;
    display:flex; align-items:flex-start; justify-content:center; padding:30px 16px;
  }
  .pmodal{
    background:var(--bg); border:1px solid var(--border); width:100%; max-width:560px; padding:30px 26px 40px;
    position:relative;
  }
  .pmodal h2{text-align:center; font-size:26px; margin-bottom:26px;}
  .pmodal .close-x{position:absolute; top:22px; right:22px; font-size:22px; color:#999; cursor:pointer;}
  .upload-box{
    width:100px; height:100px; border:1px dashed #444; display:flex; align-items:center; justify-content:center;
    color:#666; font-size:22px; cursor:pointer; background-size:cover; background-position:center;
    margin-bottom:20px;
  }
  .switch-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0;}
  .switch{
    width:44px; height:24px; border-radius:14px; background:#333; position:relative; cursor:pointer; flex-shrink:0;
  }
  .switch.on{background:#eee;}
  .switch .knob{
    position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#888; transition:.15s;
  }
  .switch.on .knob{left:23px; background:#0a0a0a;}
  .pmodal .actions-col{margin-top:24px; display:flex; flex-direction:column; gap:12px;}

  @media(max-width:640px){
    .hero h1{font-size:44px;}
    .hero p{font-size:16px;}
    .section-head h2{font-size:28px;}
    .admin-header h1{font-size:26px;}
  }
</style>
</head>

/* ============ SAFE STORAGE (falls back to in-memory if localStorage is blocked, e.g. file:// pages) ============ */
const memoryStore = {};
let storageAvailable = true;
try {
  const testKey = '__sc_test__';
  localStorage.setItem(testKey, '1');
  localStorage.removeItem(testKey);
} catch(e) {
  storageAvailable = false;
}

function load(key, fallbackFn){
  try{
    if(storageAvailable){
      const raw = localStorage.getItem(key);
      if(raw) return JSON.parse(raw);
    } else if(memoryStore[key] !== undefined){
      return memoryStore[key];
    }
  }catch(e){}
  const fallback = fallbackFn();
  save(key, fallback);
  return fallback;
}
function save(key, val){
  try{
    if(storageAvailable){
      localStorage.setItem(key, JSON.stringify(val));
      return;
    }
  }catch(e){}
  memoryStore[key] = val;
}

let products = load(LS_KEYS.products, defaultProducts);
let leads = load(LS_KEYS.leads, defaultLeads);
let settings = load(LS_KEYS.settings, defaultSettings);
let session = load(LS_KEYS.session, () => ({ loggedIn:false, email:null }));
let selectedCategory = 'Featured';

/* ============ ROUTER ============ */
function route(){
  const hash = location.hash || '#/';
  if(hash.startsWith('#/admin/login')) return renderLogin();
  if(hash.startsWith('#/admin')) {
    if(!session.loggedIn){ location.hash = '#/admin/login'; return; }
    return renderAdmin();
  }
  return renderStore();
}
window.addEventListener('hashchange', route);

/* ============ HELPERS ============ */
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function money(n){ return 'R' + Number(n).toLocaleString('en-ZA'); }

function waLink(text){
  let num = (settings.whatsapp || '').replace(/\D/g,'');
  if(num.startsWith('0')) num = '27' + num.slice(1); // convert SA local format to international
  return `https://wa.me/${num}?text=${encodeURIComponent(text)}`;
}

function logLead(product, color){
  const today = new Date().toISOString().slice(0,10).replace(/-/g,'/');
  leads.unshift({ id:uid(), product, color: color || '', date:today });
  save(LS_KEYS.leads, leads);
}

function orderProduct(id){
  const p = products.find(x => x.id === id);
  if(!p) return;
  const sizeSel = document.getElementById('size-'+p.id);
  const colorSel = document.getElementById('color-'+p.id);
  const size = sizeSel ? sizeSel.value : '';
  const color = colorSel ? colorSel.value : '';
  const activePrice = p.specialActive && p.salePrice ? p.salePrice : p.price;
  let msg = `Hi Stylish Closet! I'd like to order:\n\n${p.name}`;
  if(color) msg += `\nColour: ${color}`;
  if(size) msg += `\nSize: ${size}`;
  msg += `\nPrice: ${money(activePrice)}`;
  msg += `\n\nIs this still available?`;
  logLead(p.name, color);
  window.open(waLink(msg), '_blank');
}

/* ============ LIGHTBOX / SLIDESHOW ============ */
let lightboxState = { productId: null, index: 0 };

function openLightbox(productId){
  const p = products.find(x => x.id === productId);
  if(!p || !p.images || !p.images.length) return;
  lightboxState = { productId, index: 0 };
  renderLightbox();
}

function renderLightbox(){
  const existing = document.getElementById('lightbox');
  if(existing) existing.remove();

  const p = products.find(x => x.id === lightboxState.productId);
  if(!p) return;
  const imgs = p.images || [];
  if(!imgs.length) return;
  if(lightboxState.index >= imgs.length) lightboxState.index = 0;
  if(lightboxState.index < 0) lightboxState.index = imgs.length - 1;

  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  overlay.id = 'lightbox';
  overlay.onclick = (e) => { if(e.target === overlay) closeLightbox(); };
  overlay.innerHTML = `
    <span class="lightbox-close" onclick="closeLightbox()">✕</span>
    <div class="lightbox-stage">
      ${imgs.length > 1 ? `<div class="lightbox-arrow prev" onclick="lightboxNav(-1)">‹</div>` : ''}
      <img class="lightbox-img" src="${imgs[lightboxState.index]}" alt="${esc(p.name)}">
      ${imgs.length > 1 ? `<div class="lightbox-arrow next" onclick="lightboxNav(1)">›</div>` : ''}
    </div>
    <div class="lightbox-caption">${esc(p.name)}</div>
    ${imgs.length > 1 ? `<div class="lightbox-dots">${imgs.map((_, i) => `<div class="lightbox-dot ${i===lightboxState.index?'active':''}" onclick="lightboxGoTo(${i})"></div>`).join('')}</div>` : ''}
  `;
  document.body.appendChild(overlay);
}

function lightboxNav(dir){
  lightboxState.index += dir;
  renderLightbox();
}
function lightboxGoTo(i){
  lightboxState.index = i;
  renderLightbox();
}
function closeLightbox(){
  const el = document.getElementById('lightbox');
  if(el) el.remove();
}
document.addEventListener('keydown', (e) => {
  if(!document.getElementById('lightbox')) return;
  if(e.key === 'Escape') closeLightbox();
  if(e.key === 'ArrowRight') lightboxNav(1);
  if(e.key === 'ArrowLeft') lightboxNav(-1);
});

/* ============ STOREFRONT ============ */
function productCardHTML(p){
  const isSoldOut = p.status === 'Sold Out' || p.stock <= 0;
  const showSale = p.specialActive && p.salePrice;
  const badges = [];
  if(p.newDrop) badges.push('<span class="badge badge-new">New Drop</span>');
  if(showSale) badges.push('<span class="badge badge-special">Special</span>');

  const sizesHtml = p.sizes && p.sizes.length
    ? `<select id="size-${p.id}">${p.sizes.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select>` : '';
  const colorsHtml = p.colors && p.colors.length
    ? `<select id="color-${p.id}">${p.colors.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select>` : '';

  const variantsLine = [
    p.sizes && p.sizes.length ? p.sizes.join(' · ') : '',
    p.colors && p.colors.length ? p.colors.join(' · ') : ''
  ].filter(Boolean).join(' | ');

  const imgs = p.images || [];
  const hasPhotos = imgs.length > 0;

  return `
  <div class="card ${isSoldOut ? 'sold-out':''}">
    <div class="card-media" ${hasPhotos ? `onclick="openLightbox('${p.id}')"` : ''} style="${hasPhotos ? `background:url('${imgs[0]}') center/cover;` : ''}">
      ${!hasPhotos ? `<div class="placeholder-mark">${esc(p.name)}</div>` : ''}
      <div class="badges">${badges.join('')}</div>
      ${imgs.length > 1 ? `<div class="photo-count">1 / ${imgs.length}</div>` : ''}
    </div>
    <div class="card-body">
      <div class="kicker">${esc(p.category)}</div>
      <h3>${esc(p.name)}</h3>
      <div class="price-row">
        ${showSale ? `<span class="price-now">${money(p.salePrice)}</span><span class="price-old">${money(p.price)}</span><span class="fire">🔥</span><span class="kicker" style="color:var(--accent)">Special</span>`
                   : `<span class="price-now">${money(p.price)}</span>`}
      </div>
      ${variantsLine ? `<div class="variants">${esc(variantsLine)}</div>` : ''}
      ${sizesHtml}${colorsHtml}
      <button class="order-btn" ${isSoldOut?'disabled':''} onclick="orderProduct('${p.id}')">
        ${isSoldOut ? 'Sold Out' : 'Order Now → WhatsApp'}
      </button>
    </div>
  </div>`;
}

function categoryResultsHTML(){
  const filtered = selectedCategory === 'Featured'
    ? products.filter(p => p.featured)
    : products.filter(p => p.category === selectedCategory);

  if(!filtered.length){
    return `<p class="cat-empty">Nothing in this category yet — check back soon.</p>`;
  }
  return `<div class="grid">${filtered.map(productCardHTML).join('')}</div>`;
}

/* ============ ADMIN: LOGIN ============ */
function renderLogin(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-icon">→]</div>
      <h1>Welcome Back</h1>
      <div class="sub">Log in to your account</div>
      <div class="auth-card">
        <div id="login-error"></div>
        <button class="g-btn" onclick="openGooglePicker()"><b>G</b> Continue with Google</button>
        <div class="divider">OR</div>
        <div class="field">
          <label>Email</label>
          <input id="login-email" type="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <div class="field-row"><label>Password</label><a href="#" onclick="return false;">Forgot password?</a></div>
          <input id="login-password" type="password" placeholder="••••••••">
        </div>
        <button class="btn btn-primary btn-block" onclick="manualLogin()">Log In</button>
      </div>
      <div class="auth-foot">Don't have an account? <b onclick="alert('Admin accounts are provisioned by the store owner.')">Create one</b></div>
      <div style="margin-top:26px;"><a href="#/" style="color:#777; font-size:13px;">← Back to store</a></div>
    </div>
  `;
}

function loginSuccess(email){
  session = { loggedIn:true, email };
  save(LS_KEYS.session, session);
  location.hash = '#/admin';
}

function manualLogin(){
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const errorBox = document.getElementById('login-error');
  if(email === ADMIN_EMAIL){
    loginSuccess(ADMIN_EMAIL);
  } else {
    errorBox.innerHTML = `<div class="auth-error">Access denied. This admin panel is restricted to the store owner's account.</div>`;
  }
}

function openGooglePicker(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'g-picker';
  overlay.innerHTML = `
    <div class="g-modal">
      <span class="close-x" onclick="document.getElementById('g-picker').remove()">✕</span>
      <div style="font-size:26px; margin-bottom:8px;">🟦🟥🟨🟩</div>
      <h2>Choose an account</h2>
      <div class="sub">to continue to Lovable</div>
      ${GOOGLE_ACCOUNTS.map(a => `
        <div class="g-acct" onclick="chooseGoogleAccount('${a.email}')">
          <div class="g-avatar" style="background:${a.color}">${a.initial}</div>
          <div>
            <div class="g-acct-name">${esc(a.name)}</div>
            <div class="g-acct-email">${esc(a.email)}</div>
          </div>
        </div>`).join('')}
      <div class="g-acct" onclick="document.getElementById('g-picker').remove()">
        <div class="g-avatar" style="background:#444;">＋</div>
        <div class="g-acct-name">Use another account</div>
      </div>
      <div style="font-size:12px; color:#888; margin-top:18px; line-height:1.5;">
        Before using this app, you can review Lovable's Privacy Policy and Terms of Service.
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function chooseGoogleAccount(email){
  document.getElementById('g-picker').remove();
  if(email === ADMIN_EMAIL){
    loginSuccess(ADMIN_EMAIL);
  } else {
    renderLogin();
    document.getElementById('login-error').innerHTML =
      `<div class="auth-error">${esc(email)} isn't authorized for the admin dashboard.</div>`;
  }
}

function signOut(){
  session = { loggedIn:false, email:null };
  save(LS_KEYS.session, session);
  location.hash = '#/';
}

/* ============ ADMIN: DASHBOARD ============ */
function stats(){
  const total = products.length;
  const inStock = products.filter(p => p.stock > 0).length;
  const lowStock = products.filter(p => p.stock > 0 && p.stock <= 3).length;
  const activeSpecials = products.filter(p => p.specialActive && p.salePrice).length;
  return { total, inStock, lowStock, whatsappLeads: leads.length, activeSpecials };
}

      <div class="stat-card"><div class="kicker">Low Stock</div><div class="num">${s.lowStock}</div><div class="note">3 or fewer left</div></div>
      <div class="stat-card"><div class="kicker">WhatsApp Leads</div><div class="num">${s.whatsappLeads}</div></div>
      <div class="stat-card"><div class="kicker">Active Specials</div><div class="num">${s.activeSpecials}</div></div>
    </div>

    <div class="admin-section">
      <div class="admin-section-head">
        <h2>Products</h2>
        <button class="btn btn-primary btn-sm" onclick="openProductModal()">+ Add Product</button>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Special</th><th>Actions</th></tr>
          </thead>
          <tbody>
            ${products.map(p => `
              <tr>
                <td>${esc(p.name)}</td>
                <td>${esc(p.category)}</td>
                <td>${money(p.specialActive && p.salePrice ? p.salePrice : p.price)}${p.specialActive && p.salePrice ? `<span class="strike">${money(p.price)}</span>` : ''}</td>
                <td class="${p.stock<=3?'low-note':''}">${p.stock}</td>
                <td><button class="toggle-pill ${p.specialActive?'on':''}" onclick="toggleSpecial('${p.id}')">${p.specialActive?'ON':'OFF'}</button></td>
                <td>
                  <button class="icon-btn" title="Edit" onclick="openProductModal('${p.id}')">✎</button>
                  <button class="icon-btn" title="Delete" onclick="deleteProduct('${p.id}')">🗑</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <div class="admin-section">
      <div class="admin-section-head"><h2>Recent WhatsApp Leads</h2></div>
      <div class="leads-list">
        ${leads.length ? leads.slice(0,10).map(l => `
          <div class="lead-row">
            <div>${esc(l.product)}${l.color ? ' — ' + esc(l.color) : ''}</div>
            <div class="date">${esc(l.date)}</div>
          </div>`).join('') : '<div class="empty-note">No leads yet.</div>'}
      </div>
    </div>

    <div class="admin-section">
      <div class="admin-section-head"><h2>Store Settings</h2></div>
      <div class="settings-card">
        <div class="field">
          <label>WhatsApp Number</label>
          <input id="settings-wa" value="${esc(settings.whatsapp)}">
        </div>
        <div class="field">
          <label>Limited Stock Banner</label>
          <input id="settings-banner" value="${esc(settings.banner)}">
        </div>
        <button class="btn btn-primary" onclick="saveSettings(event)">Save Settings</button>
      </div>
    </div>
  `;
}

function toggleSpecial(id){
  const p = products.find(x => x.id === id);
  if(!p) return;
  p.specialActive = !p.specialActive;
  save(LS_KEYS.products, products);
  reRenderAdminKeepScroll();
}

function deleteProduct(id){
  if(!confirm('Delete this product? This cannot be undone.')) return;
  products = products.filter(x => x.id !== id);
  save(LS_KEYS.products, products);
  reRenderAdminKeepScroll();
}

function saveSettings(evt){
  const waVal = document.getElementById('settings-wa').value.trim();
  const bannerVal = document.getElementById('settings-banner').value.trim();
  if(!waVal){ alert('Please enter a WhatsApp number.'); return; }
  settings.whatsapp = waVal;
  settings.banner = bannerVal || settings.banner;
  save(LS_KEYS.settings, settings);

  const btn = evt.target;
  const original = btn.textContent;
  btn.textContent = 'Saved ✓';
  btn.disabled = true;
  setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1400);
}

function reRenderAdminKeepScroll(){
  const y = window.scrollY;
  renderAdmin();
  window.scrollTo(0, y);
}

/* ============ PRODUCT MODAL (Add/Edit) ============ */
let editingImages = [null, null]; // up to 2 photos

function openProductModal(id){
  const editing = id ? products.find(p => p.id === id) : null;
  const existing = editing && editing.images ? editing.images : [];
  editingImages = [existing[0] || null, existing[1] || null];

  const overlay = document.createElement('div');
  overlay.className = 'pmodal-overlay';
  overlay.id = 'p-modal';
  overlay.innerHTML = `
    <div class="pmodal">
      <span class="close-x" onclick="document.getElementById('p-modal').remove()">✕</span>
      <h2>${editing ? 'Edit Product' : 'Add Product'}</h2>

      <div class="field"><label>Photos (up to 2)</label>
        <div style="display:flex; gap:16px;">
          <div style="position:relative;">
            <div class="upload-box" id="upload-box-0" onclick="document.getElementById('file-input-0').click()"
                 style="${editingImages[0] ? `background-image:url('${editingImages[0]}'); background-size:cover; background-position:center;` : ''}">
              ${editingImages[0] ? '' : '⬆'}
            </div>
            ${editingImages[0] ? `<span onclick="clearSlotImage(0)" style="position:absolute; top:-8px; right:-8px; background:#111; border:1px solid #444; border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:12px;">✕</span>` : ''}
          </div>
          <div style="position:relative;">
            <div class="upload-box" id="upload-box-1" onclick="document.getElementById('file-input-1').click()"
                 style="${editingImages[1] ? `background-image:url('${editingImages[1]}'); background-size:cover; background-position:center;` : ''}">
              ${editingImages[1] ? '' : '⬆'}
            </div>
            ${editingImages[1] ? `<span onclick="clearSlotImage(1)" style="position:absolute; top:-8px; right:-8px; background:#111; border:1px solid #444; border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:12px;">✕</span>` : ''}
          </div>
        </div>
        <input type="file" id="file-input-0" accept="image/*" class="hidden" onchange="handleImageUpload(event, 0)">
        <input type="file" id="file-input-1" accept="image/*" class="hidden" onchange="handleImageUpload(event, 1)">
      </div>

      <div class="field"><label>Name</label><input id="f-name" value="${editing ? esc(editing.name) : ''}"></div>

      <div class="field"><label>Category</label>
        <select id="f-category">
          ${['Tracksuits','Hoodies','Tees','Shorts','Caps','Shoes','Accessories'].map(c =>
            `<option value="${c}" ${editing && editing.category===c ? 'selected':''}>${c}</option>`).join('')}
        </select>
      </div>

      <div class="field"><label>Description</label><textarea id="f-desc" rows="4">${editing ? esc(editing.description||'') : ''}</textarea></div>

      <div class="field"><label>Price (R)</label><input id="f-price" type="number" value="${editing ? editing.price : ''}"></div>

      <div class="field"><label>Sale Price (R)</label><input id="f-sale" type="number" placeholder="Optional" value="${editing && editing.salePrice ? editing.salePrice : ''}"></div>

      <div class="field"><label>Sizes (comma separated)</label><input id="f-sizes" placeholder="S, M, L, XL" value="${editing ? esc((editing.sizes||[]).join(', ')) : ''}"></div>

      <div class="field"><label>Colours (comma separated)</label><input id="f-colors" placeholder="Black, White" value="${editing ? esc((editing.colors||[]).join(', ')) : ''}"></div>

      <div class="field"><label>Stock Quantity</label><input id="f-stock" type="number" value="${editing ? editing.stock : 0}"></div>

      <div class="field"><label>Status</label>
        <select id="f-status">
          <option value="Available" ${editing && editing.status==='Available' ? 'selected':''}>Available</option>
          <option value="Sold Out" ${editing && editing.status==='Sold Out' ? 'selected':''}>Sold Out</option>
        </select>
      </div>

      <div class="switch-row"><span>Special price active</span>
        <div class="switch ${editing && editing.specialActive ? 'on':''}" id="sw-special" onclick="toggleSwitch('sw-special')"><div class="knob"></div></div>
      </div>
      <div class="switch-row"><span>Featured product</span>
        <div class="switch ${editing && editing.featured ? 'on':''}" id="sw-featured" onclick="toggleSwitch('sw-featured')"><div class="knob"></div></div>
      </div>
      <div class="switch-row"><span>New drop</span>
        <div class="switch ${editing && editing.newDrop ? 'on':''}" id="sw-newdrop" onclick="toggleSwitch('sw-newdrop')"><div class="knob"></div></div>
      </div>

      <div class="actions-col">
        <button class="btn btn-primary" onclick="saveProduct(${editing ? `'${editing.id}'` : 'null'}, event)">Publish</button>
        <button class="btn btn-outline" onclick="document.getElementById('p-modal').remove()">Cancel</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function toggleSwitch(id){
  document.getElementById(id).classList.toggle('on');
}
function isSwitchOn(id){
  return document.getElementById(id).classList.contains('on');
}

function handleImageUpload(event, slot){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    editingImages[slot] = e.target.result;
    // re-render just this slot's box for immediate feedback
    const box = document.getElementById('upload-box-' + slot);
    if(box){
      box.style.backgroundImage = `url('${editingImages[slot]}')`;
      box.style.backgroundSize = 'cover';
      box.style.backgroundPosition = 'center';
      box.innerHTML = '';
      if(box.parentElement && !box.parentElement.querySelector('.remove-photo-btn')){
        const removeBtn = document.createElement('span');
        removeBtn.className = 'remove-photo-btn';
        removeBtn.textContent = '✕';
        removeBtn.style.cssText = 'position:absolute; top:-8px; right:-8px; background:#111; border:1px solid #444; border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:12px;';
        removeBtn.onclick = () => clearSlotImage(slot);
        box.parentElement.appendChild(removeBtn);
      }
    }
  };
  reader.readAsDataURL(file);
}

function clearSlotImage(slot){
  editingImages[slot] = null;
  const box = document.getElementById('upload-box-' + slot);
  if(box){
    box.style.backgroundImage = '';
    box.innerHTML = '⬆';
  }
  const wrapper = box ? box.parentElement.querySelector('.remove-photo-btn') : null;
  if(wrapper) wrapper.remove();
}

function saveProduct(id, evt){
  const name = document.getElementById('f-name').value.trim();
  if(!name){ alert('Product name is required.'); return; }
  const category = document.getElementById('f-category').value;
  const description = document.getElementById('f-desc').value.trim();
  const price = parseFloat(document.getElementById('f-price').value);
  if(isNaN(price) || price < 0){ alert('Please enter a valid price.'); return; }
  const salePriceRaw = document.getElementById('f-sale').value;
  let salePrice = salePriceRaw ? parseFloat(salePriceRaw) : null;
  if(salePrice !== null && (isNaN(salePrice) || salePrice < 0)){ alert('Please enter a valid sale price, or leave it blank.'); return; }
  if(salePrice !== null && salePrice >= price){ alert('Sale price should be lower than the regular price.'); return; }
  const sizes = document.getElementById('f-sizes').value.split(',').map(s=>s.trim()).filter(Boolean);
  const colors = document.getElementById('f-colors').value.split(',').map(s=>s.trim()).filter(Boolean);
  const stock = parseInt(document.getElementById('f-stock').value);
  if(isNaN(stock) || stock < 0){ alert('Please enter a valid stock quantity.'); return; }
  const status = document.getElementById('f-status').value;
  const specialActive = isSwitchOn('sw-special');
  const featured = isSwitchOn('sw-featured');
  const newDrop = isSwitchOn('sw-newdrop');

  const images = editingImages.filter(Boolean);
  const data = { name, category, description, price, salePrice, sizes, colors, stock, status, specialActive, featured, newDrop, images };

  const publishBtn = evt.target;
  publishBtn.disabled = true;
  publishBtn.textContent = 'Saving...';

  if(id){
    const idx = products.findIndex(p => p.id === id);
    products[idx] = { ...products[idx], ...data };
  } else {
    products.push({ id: uid(), ...data });
  }
  save(LS_KEYS.products, products);
  document.getElementById('p-modal').remove();
  renderAdmin();
}

/* ============ INIT ============ */
try {
  route();
} catch(err) {
  document.getElementById('app').innerHTML =
    `<div style="padding:40px;color:#fff;font-family:sans-serif;">
       <h2 style="margin-bottom:12px;">Something went wrong loading the store</h2>
       <p style="color:#999;">${(err && err.message) ? err.message : err}</p>
     </div>`;
  console.error(err);
}
if(!storageAvailable){
  const notice = document.createElement('div');
  notice.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#2a1414;color:#ff9a9a;font-size:12px;padding:10px 16px;text-align:center;z-index:999;';
  notice.textContent = "Note: this page was opened as a local file, so changes won't be saved between visits. Host it online (or open it in a normal browser tab) to keep your data.";
  document.body.appendChild(notice);
}
</script>
</body>
</html>
